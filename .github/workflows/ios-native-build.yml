name: iOS native build

on:
  workflow_dispatch:
  push:
    branches:
      - ios-app
    paths:
      - .github/workflows/ios-native-build.yml
      - apps/mobile/**
      - apps/web/**
      - packages/shared/**
      - scripts/assert-screenshot-content.swift
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: ios-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-smoke:
    name: Compile and launch with Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        run: pnpm --filter @aha/mobile sync

      - name: Validate native artwork
        run: |
          ICON="apps/mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-AHA-1024.png"
          SPLASH="apps/mobile/ios/App/App/Assets.xcassets/Splash.imageset/aha-launch-2732.png"

          test "$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/{print $2}')" = "1024"
          test "$(sips -g hasAlpha "$ICON" | awk '/hasAlpha/{print $2}')" = "no"
          test "$(sips -g pixelWidth "$SPLASH" | awk '/pixelWidth/{print $2}')" = "2732"
          test "$(sips -g pixelHeight "$SPLASH" | awk '/pixelHeight/{print $2}')" = "2732"
          test "$(sips -g hasAlpha "$SPLASH" | awk '/hasAlpha/{print $2}')" = "no"

      - name: Compile the native app without signing
        run: |
          xcodebuild \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/AhaDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build for the iOS simulator
        run: |
          xcodebuild \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AhaSimulatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          test -d "$RUNNER_TEMP/AhaSimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$RUNNER_TEMP/AhaSimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy"

      - name: Launch on an iPhone simulator
        timeout-minutes: 12
        run: |
          DEVICE="$(xcrun simctl list devices available -j | jq -c '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first')"
          UDID="$(jq -r '.udid' <<< "$DEVICE")"
          test -n "$UDID"
          test "$UDID" != "null"
          jq -r '"Selected simulator: \(.name) (\(.udid))"' <<< "$DEVICE"

          cleanup() {
            xcrun simctl shutdown "$UDID" || true
          }
          trap cleanup EXIT

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/AhaSimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$UDID" dev.adrez.aha
          sleep 12
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/aha-iphone-launch.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/aha-iphone-launch.png"
          xcrun simctl spawn "$UDID" log show \
            --last 3m \
            --style compact \
            --info \
            --debug \
            --predicate 'process == "App" OR process CONTAINS[c] "WebContent" OR process CONTAINS[c] "WebKit"' \
            > "$RUNNER_TEMP/aha-iphone.log" 2>&1 || true
          xcrun swift scripts/assert-screenshot-content.swift "$RUNNER_TEMP/aha-iphone-launch.png"

      - name: Launch on an iPad simulator
        timeout-minutes: 12
        run: |
          DEVICE="$(xcrun simctl list devices available -j | jq -c '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPad")))] | first')"
          UDID="$(jq -r '.udid' <<< "$DEVICE")"
          test -n "$UDID"
          test "$UDID" != "null"
          jq -r '"Selected simulator: \(.name) (\(.udid))"' <<< "$DEVICE"

          cleanup() {
            xcrun simctl shutdown "$UDID" || true
          }
          trap cleanup EXIT

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/AhaSimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$UDID" dev.adrez.aha
          sleep 12
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/aha-ipad-launch.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/aha-ipad-launch.png"
          xcrun simctl spawn "$UDID" log show \
            --last 3m \
            --style compact \
            --info \
            --debug \
            --predicate 'process == "App" OR process CONTAINS[c] "WebContent" OR process CONTAINS[c] "WebKit"' \
            > "$RUNNER_TEMP/aha-ipad.log" 2>&1 || true
          xcrun swift scripts/assert-screenshot-content.swift "$RUNNER_TEMP/aha-ipad-launch.png"

      - name: Upload simulator launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-simulator-launch
          path: |
            ${{ runner.temp }}/aha-iphone-launch.png
            ${{ runner.temp }}/aha-ipad-launch.png
            ${{ runner.temp }}/aha-iphone.log
            ${{ runner.temp }}/aha-ipad.log
          if-no-files-found: warn
