<!doctype html><html lang="en"><meta charset="utf-8"><title>Hvem mon? — screenshot gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#21113d;color:#fff4de;font:16px system-ui,sans-serif}h1{margin:0 0 8px;font-size:32px}p{margin:0 0 25px;color:#cbbbe8}h2{font-size:20px;margin:28px 0 16px}section{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}a{color:inherit;text-decoration:none}img{width:100%;display:block;border-radius:10px}small{display:block;margin:9px 0;color:#d5cce4}header{display:flex;justify-content:space-between;align-items:center}nav a{margin-left:20px;color:#ffe14d}@media(max-width:900px){section{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style><header><div><h1>Hvem mon?</h1><p>Real gameplay. Original promotional artwork. Six images per device and language.</p></div><nav><a href="?lang=da">Dansk</a><a href="?lang=en">English</a></nav></header><div id="gallery"></div>
<script>
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'da';
document.documentElement.lang=lang;
for(const [device,label,size] of [['iphone','iPhone','1320 × 2868'],['ipad','iPad','2064 × 2752']]){
 const heading=document.createElement('h2');heading.textContent=`${label} · ${lang.toUpperCase()} · ${size}`;gallery.append(heading);
 const section=document.createElement('section');gallery.append(section);
 for(let i=1;i<=6;i++){const id=String(i).padStart(2,'0');const a=document.createElement('a');a.href=`final/${lang}/${device}/${id}.png`;const img=document.createElement('img');img.src=a.href;img.alt=`${label} ${lang} screenshot ${i}`;a.append(img);const caption=document.createElement('small');caption.textContent=`${id} / 06`;a.append(caption);section.append(a);}
}
</script></html>
