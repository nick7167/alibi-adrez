<body>
<main class="slide">

</main>
<script>
const slides = {
da:[
 ['Hvem skrev\nlige dét?','Gæt, hvem af vennerne der står bag svaret.','01-guess','#ffe14d','#261151','Kender du\ndine venner?','Ét svar.\nMange\nmistænkte.','Alle svarer først. Så begynder gætteriet.','Svar → gæt → afslør'],
 ['Skriv.\nHold masken.','Kan vennerne genkende dig i dit svar?','02-answer','#ded1ff','#261151','Dit svar. Stadig hemmeligt.','Det lyder\naltså\nsom dig.','Svarene er anonyme i gætterunden — ikke bagefter.','Skriv → send → hold masken'],
 ['Nååå.\nDet var dig!','Se forfatteren. Og de rigtige gæt.','03-reveal','#4a1fd6','#ffe14d','Nu giver det\nhele mening.','Sandhedens\nlille\nøjeblik.','Forfatteren bliver afsløret, og pointene bliver fordelt.','Fra mistanke til afsløring'],
 ['Ét rum.\nAlle skærme.','iPhone, iPad eller browser. Spil sammen.','04-lobby','#fff4de','#261151','3–16 spillere. Ingen konto.','Samme rum.\nHver sin\nskærm.','Del en privat rumkode, og lad vennerne være med.','Telefon · tablet · browser'],
 ['Hverdag eller\nvilde påfund?','Vælg spørgsmål, der passer til jer.','05-packs','#c9efca','#261151','I sætter\nrammerne.','Små\nspørgsmål.\nStore grin.','Hverdag, holdninger, det absurde og milde tilståelser.','Fire temaer · jeres valg'],
 ['Hvem kender\njer bedst?','Se pointene. Tag en runde mere.','06-finale','#ffe14d','#261151','Skal vi tage\nen til?','Venner\nførst.\nRivaler nu.','Tilbage til samme rum — klar til næste spil.','En finale. Mere at gætte.'],
],
en:[
 ['Who wrote\nTHAT?','Guess which friend is behind the answer.','01-guess','#ffe14d','#261151','Know your\nfriends?','One answer.\nA room of\nsuspects.','Everyone answers first. Then the guessing begins.','Answer → guess → reveal'],
 ['Type it.\nPlay it cool.','Can your friends tell it’s you?','02-answer','#ded1ff','#261151','Your answer. Still a secret.','That sounds\njust\nlike you.','Authors stay hidden during guessing — then get revealed.','Write → send → play it cool'],
 ['Wait.\nIt was YOU?','The author. The guesses. All revealed.','03-reveal','#4a1fd6','#ffe14d','Now it all\nmakes sense.','The moment\nit all\nclicks.','The author is revealed and the points are awarded.','From suspicion to revelation'],

 ['Who knows\nyou best?','Check the scores. Play another round.','06-finale','#ffe14d','#261151','One more\ngame?','Friends\nfirst.\nRivals now.','Back to the same room, ready for the next game.','One finale. More to guess.'],
]};
const params = new URLSearchParams(location.search);
const lang = params.get('lang') === 'en' ? 'en' : 'da';
const device = params.get('device') === 'ipad' ? 'ipad' : 'iphone';
const index = Math.max(0, Math.min(5, Number(params.get('slide') || 1) - 1));
const [title, subtitle, raw, background, ink, ticket, aside, detail, footer] = slides[lang][index];
document.documentElement.lang = lang;
document.body.dataset.device = device;
// Deliberately keep one palette throughout the entire localized campaign.
document.querySelector('.slide').classList.add('s'+(index+1));
document.querySelector('h1').textContent = title;
document.querySelector('.sub').textContent = subtitle;
document.querySelector('.category').textContent = lang === 'da' ? 'Gæt dine venner' : 'Guess your friends';
document.querySelector('.ticket').textContent = ticket;
document.querySelector('.aside span').textContent = aside;
document.querySelector('.aside small').textContent = detail;
document.querySelector('.footer span').textContent = footer;
document.querySelector('.index').textContent = '0'+(index+1)+' / 06';
document.querySelector('img').src = `raw/${lang}/${device}/${raw}.png`;
document.querySelector('img').alt = lang === 'da' ? 'Det faktiske spil Hvem mon?' : 'Actual Hvem mon? gameplay';
for(let i=0;i<3;i++){
  const img=document.createElement('img');
  img.src=`raw/${lang}/${device}/${raw}-detail-${i}.png`;
  img.alt=lang === 'da' ? 'Forstørret detalje fra det faktiske spil' : 'Enlarged detail from actual gameplay';
  document.querySelector('.details').append(img);
}
</script>
